    const image=new Image();let retries=0,source=c.image;image.onload=()=>{
      if(gen!==generation)return;
      if(image.naturalWidth*image.naturalHeight>25000000||(c.rows&&sheetScale(image.naturalWidth,image.naturalHeight,c.rows)!==1)){group.textContent='이미지 크기를 확인하세요';send('invalid',{index,reason:'size'});return;}
      item.valid=true;button.disabled=false;item.source=source;
      if(!c.rows){node.style.backgroundImage=cssUrl(source);item.drawn=source;}
      // A sheet: frame() draws it (a sharper copy already made straight away, when the pet is drawn larger).
      else{node.__item=item;item.sharpOn=!!item.sharp&&drawnScale(item)>1.05;frame(node,0,0,c.rows);}
      if(index===m.selected||mini){choose(index);if(!mini)animate(index,animation);}
    };
    // A load error can be passing (the file was being written, e.g. by a sync): try once more before giving up.
    image.onerror=()=>{if(gen!==generation)return;if(retries++<1){setTimeout(()=>{if(gen===generation){source=c.image+(c.image.indexOf('?')<0?'?':'&')+'retry=1';image.src=source;}},500);return;}
      group.textContent='이미지를 읽을 수 없습니다';send('invalid',{index,reason:'load'});};image.src=source;
    if(!mini){
      button.onclick=()=>choose(index);button.onpointerenter=()=>animate(index,'jumping',2);
      button.onpointerleave=()=>{if(index!==selected){clearTimeout(timers[index]);items[index].token++;if(c.rows)frame(node,0,0,c.rows);}};
    }
  });
  // Once for all the pets (not again after each one); a reloaded page keeps the last layout until the app sends a new one.
  if(m.layout)applyLayout(m.layout);else if(layout)applyLayout(layout);
});
// Windows' "show animations" switched while pets show: with reduced motion they stop on their current action's frame,
// and they move again when it is turned back on (no timer runs while it is on, so nothing else would restart them).
const motionChanged=()=>{if(mini)items.forEach((it,i)=>{if(it.valid)animate(i);});else if(selected>=0)animate(selected,animation);};
if(typeof reduced.addEventListener==='function')reduced.addEventListener('change',motionChanged);
else if(typeof reduced.addListener==='function')reduced.addListener(motionChanged);
// 캐릭터 선택: the browser keeps Esc from the window, so the page hands it over (the window closes like 취소).
if(!mini&&typeof document.addEventListener==='function')document.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();send('escape');}});
send('ready');
</script></body></html>
